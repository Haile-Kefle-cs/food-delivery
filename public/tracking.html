<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order - Food Delivery</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-wrapper">
                <div class="logo">
                    <a href="index.html">
                        <i class="fas fa-utensils"></i>
                        <span>FoodDelivery</span>
                    </a>
                </div>
                
                <ul class="nav-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="menu.html">Menu</a></li>
                    <li><a href="tracking.html" class="active">Track Order</a></li>
                </ul>
                
                <div class="nav-actions">
                    <a href="cart.html" class="cart-icon">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="cart-count" id="cart-count">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Tracking Section -->
    <section class="tracking-section">
        <div class="container">
            <h1 class="page-title">Track Your Order</h1>
            <p class="tracking-subtitle">Enter your order number to see the status</p>
            
            <!-- Order Search -->
            <div class="tracking-search">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="order-number-input" placeholder="Enter order number (e.g., ORD-20240817-AB12)">
                    <button class="btn btn-primary" onclick="trackOrder()">
                        <i class="fas fa-truck"></i> Track Order
                    </button>
                </div>
                <p class="help-text">Order number format: ORD-YYYYMMDD-XXXX</p>
            </div>
            
            <!-- Tracking Result -->
            <div id="tracking-result" style="display: none;">
                <!-- Order Info -->
                <div class="order-info-card">
                    <div class="order-info-header">
                        <h2>Order Details</h2>
                        <span class="order-status-badge" id="order-status-badge">PENDING</span>
                    </div>
                    <div class="order-info-grid">
                        <div class="info-item">
                            <label>Order Number</label>
                            <p id="tracked-order-number"></p>
                        </div>
                        <div class="info-item">
                            <label>Order Date</label>
                            <p id="tracked-order-date"></p>
                        </div>
                        <div class="info-item">
                            <label>Total Amount</label>
                            <p id="tracked-order-total"></p>
                        </div>
                        <div class="info-item">
                            <label>Customer Name</label>
                            <p id="tracked-customer-name"></p>
                        </div>
                    </div>
                </div>
                
                <!-- Progress Tracker -->
                <div class="progress-tracker">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    
                    <div class="progress-steps">
                        <div class="progress-step active" data-step="PENDING">
                            <i class="fas fa-receipt"></i>
                            <span>Order Received</span>
                        </div>
                        <div class="progress-step" data-step="APPROVED">
                            <i class="fas fa-check-circle"></i>
                            <span>Approved</span>
                        </div>
                        <div class="progress-step" data-step="PREPARING">
                            <i class="fas fa-fire"></i>
                            <span>Preparing</span>
                        </div>
                        <div class="progress-step" data-step="READY">
                            <i class="fas fa-box"></i>
                            <span>Ready</span>
                        </div>
                        <div class="progress-step" data-step="OUT_FOR_DELIVERY">
                            <i class="fas fa-motorcycle"></i>
                            <span>Out for Delivery</span>
                        </div>
                        <div class="progress-step" data-step="DELIVERED">
                            <i class="fas fa-home"></i>
                            <span>Delivered</span>
                        </div>
                    </div>
                </div>
                
                <!-- Status Timeline -->
                <div class="status-timeline" id="status-timeline">
                    <!-- Status history will be displayed here -->
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 FoodDelivery. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/tracking.js"></script>
</body>
</html>
