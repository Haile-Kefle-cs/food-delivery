<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders Management - Food Delivery Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="admin-body">
    <!-- Admin Sidebar -->
    <div class="admin-sidebar" id="adminSidebar">
        <div class="admin-logo">
            <i class="fas fa-utensils"></i>
            <span>FoodDelivery Admin</span>
        </div>
        
        <nav class="admin-nav">
            <a href="index.html">
                <i class="fas fa-dashboard"></i>
                <span>Dashboard</span>
            </a>
            <a href="orders.html" class="active">
                <i class="fas fa-shopping-cart"></i>
                <span>Orders</span>
                <span class="badge" id="pending-orders-badge">0</span>
            </a>
            <a href="products.html">
                <i class="fas fa-hamburger"></i>
                <span>Products</span>
            </a>
            <a href="customers.html">
                <i class="fas fa-users"></i>
                <span>Customers</span>
            </a>
            <a href="reports.html">
                <i class="fas fa-chart-bar"></i>
                <span>Reports</span>
            </a>
            <a href="#" id="admin-logout">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="admin-main">
        <header class="admin-header">
            <button class="sidebar-toggle" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <h1>Orders Management</h1>
        </header>

        <div class="admin-content">
            <!-- Order Filters -->
            <div class="filters-bar">
                <div class="filter-tabs" id="order-filters">
                    <button class="filter-tab active" data-status="ALL">
                        All Orders
                    </button>
                    <button class="filter-tab" data-status="PENDING">
                        <span class="status-dot pending"></span> Pending
                    </button>
                    <button class="filter-tab" data-status="APPROVED">
                        <span class="status-dot approved"></span> Approved
                    </button>
                    <button class="filter-tab" data-status="PREPARING">
                        <span class="status-dot preparing"></span> Preparing
                    </button>
                    <button class="filter-tab" data-status="READY">
                        <span class="status-dot ready"></span> Ready
                    </button>
                    <button class="filter-tab" data-status="OUT_FOR_DELIVERY">
                        <span class="status-dot out-for-delivery"></span> Out for Delivery
                    </button>
                    <button class="filter-tab" data-status="DELIVERED">
                        <span class="status-dot delivered"></span> Delivered
                    </button>
                    <button class="filter-tab" data-status="REJECTED">
                        <span class="status-dot rejected"></span> Rejected
                    </button>
                </div>
                
                <div class="search-filter">
                    <i class="fas fa-search"></i>
                    <input type="text" id="order-search" placeholder="Search orders...">
                </div>
            </div>

            <!-- Orders Table -->
            <div class="table-card">
                <div class="table-responsive">
                    <table class="admin-table orders-table">
                        <thead>
                            <tr>
                                <th>Order #</th>
                                <th>Customer</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Payment</th>
                                <th>Status</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table-body">
                            <!-- Loaded dynamically -->
                        </tbody>
                    </table>
                </div>
                
                <div class="pagination" id="orders-pagination">
                    <!-- Pagination buttons -->
                </div>
            </div>
        </div>
    </div>

    <!-- Order Details Modal -->
    <div class="modal" id="order-details-modal">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h2>Order Details</h2>
                <span class="close-modal" onclick="closeOrderDetails()">&times;</span>
            </div>
            <div class="modal-body" id="order-details-content">
                <!-- Loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- Update Status Modal -->
    <div class="modal" id="update-status-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Update Order Status</h2>
                <span class="close-modal" onclick="closeUpdateStatus()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="update-status-form">
                    <div class="form-group">
                        <label>New Status</label>
                        <select id="new-status" required>
                            <option value="PENDING">Pending</option>
                            <option value="APPROVED">Approved</option>
                            <option value="PREPARING">Preparing</option>
                            <option value="READY">Ready</option>
                            <option value="OUT_FOR_DELIVERY">Out for Delivery</option>
                            <option value="DELIVERED">Delivered</option>
                            <option value="REJECTED">Rejected</option>
                            <option value="CANCELLED">Cancelled</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Note</label>
                        <textarea id="status-note" rows="3" placeholder="Add a note (optional)"></textarea>
                    </div>
                    <div class="form-group" id="rejection-reason-group" style="display: none;">
                        <label>Rejection Reason</label>
                        <textarea id="rejection-reason" rows="3" placeholder="Why is this order being rejected?"></textarea>
                    </div>
                    <input type="hidden" id="update-order-id">
                    <button type="submit" class="btn btn-primary btn-block">Update Status</button>
                </form>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
