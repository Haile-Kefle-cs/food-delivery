<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Management - Food Delivery Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="admin-body">
    <!-- Admin Sidebar -->
    <div class="admin-sidebar" id="adminSidebar">
        <div class="admin-logo">
            <i class="fas fa-utensils"></i>
            <span>FoodDelivery Admin</span>
        </div>
        
        <nav class="admin-nav">
            <a href="index.html">
                <i class="fas fa-dashboard"></i>
                <span>Dashboard</span>
            </a>
            <a href="orders.html">
                <i class="fas fa-shopping-cart"></i>
                <span>Orders</span>
            </a>
            <a href="products.html" class="active">
                <i class="fas fa-hamburger"></i>
                <span>Products</span>
            </a>
            <a href="customers.html">
                <i class="fas fa-users"></i>
                <span>Customers</span>
            </a>
            <a href="reports.html">
                <i class="fas fa-chart-bar"></i>
                <span>Reports</span>
            </a>
            <a href="#" id="admin-logout">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="admin-main">
        <header class="admin-header">
            <button class="sidebar-toggle" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <h1>Products Management</h1>
            <button class="btn btn-primary" onclick="openAddProduct()">
                <i class="fas fa-plus"></i> Add Product
            </button>
        </header>

        <div class="admin-content">
            <!-- Filters -->
            <div class="filters-bar">
                <div class="search-filter">
                    <i class="fas fa-search"></i>
                    <input type="text" id="product-search" placeholder="Search products...">
                </div>
                
                <select id="category-filter" class="filter-select">
                    <option value="ALL">All Categories</option>
                    <!-- Categories loaded dynamically -->
                </select>
                
                <select id="availability-filter" class="filter-select">
                    <option value="">All Status</option>
                    <option value="true">Available</option>
                    <option value="false">Unavailable</option>
                </select>
            </div>

            <!-- Products Grid -->
            <div class="products-admin-grid" id="products-admin-grid">
                <!-- Products loaded dynamically -->
            </div>
            
            <div class="pagination" id="products-pagination">
                <!-- Pagination buttons -->
            </div>
        </div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div class="modal" id="product-modal">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h2 id="product-modal-title">Add Product</h2>
                <span class="close-modal" onclick="closeProductModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="product-form">
                    <input type="hidden" id="product-id">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Product Name *</label>
                            <input type="text" id="product-name" required>
                        </div>
                        <div class="form-group">
                            <label>Category *</label>
                            <select id="product-category" required>
                                <!-- Categories loaded dynamically -->
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Description *</label>
                        <textarea id="product-description" rows="3" required></textarea>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Price (ETB) *</label>
                            <input type="number" id="product-price" min="0" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label>Discount Price (ETB)</label>
                            <input type="number" id="product-discount-price" min="0" step="0.01">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Stock Quantity *</label>
                            <input type="number" id="product-stock" min="0" required>
                        </div>
                        <div class="form-group">
                            <label>Preparation Time (minutes)</label>
                            <input type="number" id="product-prep-time" min="5" max="120" value="15">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Image URL</label>
                        <input type="url" id="product-image" placeholder="https://example.com/image.jpg">
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Ingredients (comma-separated)</label>
                            <input type="text" id="product-ingredients" placeholder="ingredient1, ingredient2">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="checkbox-group">
                            <input type="checkbox" id="product-available" checked>
                            Available
                        </label>
                        <label class="checkbox-group">
                            <input type="checkbox" id="product-featured">
                            Featured
                        </label>
                        <label class="checkbox-group">
                            <input type="checkbox" id="product-popular">
                            Popular
                        </label>
                        <label class="checkbox-group">
                            <input type="checkbox" id="product-vegetarian">
                            Vegetarian
                        </label>
                    </div>
                    
                    <div class="modal-actions">
                        <button type="button" class="btn btn-outline" onclick="closeProductModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Product</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal" id="delete-confirm-modal">
        <div class="modal-content">
            <div class="modal-body text-center">
                <i class="fas fa-trash-alt delete-icon"></i>
                <h3>Delete Product?</h3>
                <p>Are you sure you want to delete this product? This action cannot be undone.</p>
                <input type="hidden" id="delete-product-id">
                <div class="modal-actions">
                    <button class="btn btn-outline" onclick="closeDeleteConfirm()">Cancel</button>
                    <button class="btn btn-danger" onclick="confirmDeleteProduct()">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
