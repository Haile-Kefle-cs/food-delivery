<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Food Delivery</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-wrapper">
                <div class="logo">
                    <a href="index.html">
                        <i class="fas fa-utensils"></i>
                        <span>FoodDelivery</span>
                    </a>
                </div>
                
                <ul class="nav-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="menu.html">Menu</a></li>
                    <li><a href="tracking.html">Track Order</a></li>
                </ul>
                
                <div class="nav-actions">
                    <a href="cart.html" class="cart-icon active">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="cart-count" id="cart-count">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Cart Section -->
    <section class="cart-section">
        <div class="container">
            <h1 class="page-title">Your Shopping Cart</h1>
            
            <div id="cart-content">
                <!-- Empty Cart -->
                <div class="empty-cart" id="empty-cart">
                    <i class="fas fa-shopping-cart"></i>
                    <h2>Your cart is empty</h2>
                    <p>Looks like you haven't added any items yet.</p>
                    <a href="menu.html" class="btn btn-primary btn-lg">Browse Menu</a>
                </div>

                <!-- Cart Items -->
                <div class="cart-layout" id="cart-layout" style="display: none;">
                    <div class="cart-items" id="cart-items">
                        <!-- Cart items will be displayed here -->
                    </div>
                    
                    <div class="cart-summary">
                        <h2>Order Summary</h2>
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span id="subtotal">0 ETB</span>
                        </div>
                        <div class="summary-row">
                            <span>Delivery Fee</span>
                            <span id="delivery-fee">100 ETB</span>
                        </div>
                        <div class="summary-row discount-row" id="discount-row" style="display: none;">
                            <span>Discount</span>
                            <span id="discount-amount">0 ETB</span>
                        </div>
                        <div class="summary-row total-row">
                            <span>Total</span>
                            <span id="total-amount">0 ETB</span>
                        </div>
                        
                        <div class="promo-code">
                            <input type="text" id="promo-input" placeholder="Promo code">
                            <button class="btn btn-outline" onclick="applyPromoCode()">Apply</button>
                        </div>
                        
                        <button class="btn btn-primary btn-block btn-lg" onclick="proceedToCheckout()">
                            <i class="fas fa-arrow-right"></i> Proceed to Checkout
                        </button>
                        
                        <a href="menu.html" class="continue-shopping">
                            <i class="fas fa-arrow-left"></i> Continue Shopping
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 FoodDelivery. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
